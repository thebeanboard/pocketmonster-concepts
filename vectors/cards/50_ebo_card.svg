</g>

    </svg>
  </g>

  <!-- Evolution Banner -->
  <g transform="translate(45, 495)">
    <rect x="0" y="0" width="510" height="28" rx="6" fill="#F0F0F0" />
    <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#616161">Single Stage Pokémon • Homemade Archive 2020</text>
  </g>

  <!-- Moves & Concept Abilities -->
  <g transform="translate(45, 540)">
    <!-- Original Card Attack 1 -->
    <circle cx="16" cy="16" r="14" fill="#EC407A" />
    <circle cx="16" cy="16" r="6" fill="#FFFFFF" />
    <text x="40" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#212121">Magic Sneeze</text>
    <text x="510" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#212121" text-anchor="end">70</text>
    <text x="40" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#616161">Flip coin. If heads, opponent's last chosen attack is deactivated &amp; reflected.</text>
    
    <line x1="0" y1="58" x2="510" y2="58" stroke="#E0E0E0" stroke-width="1" />

    <!-- Original Card Attack 2 -->
    <circle cx="16" cy="85" r="14" fill="#EC407A" />
    <circle cx="48" cy="85" r="14" fill="#880E4F" />
    <text x="75" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#212121">Dusty Mess</text>
    <text x="510" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#212121" text-anchor="end">10</text>
    <text x="75" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-style="italic" fill="#616161">The opponent is dirtied for one turn.</text>
  </g>

  <!-- Bottom Stats / Footer -->
  <g transform="translate(45, 720)">
    <line x1="0" y1="0" x2="510" y2="0" stroke="#EC407A" stroke-width="2" opacity="0.3" />
    
    <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#757575">WEAKNESS</text>
    <text x="210" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#757575">RESISTANCE</text>
    <text x="400" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#757575">RETREAT</text>

    <!-- Weakness -->
    <circle cx="30" cy="40" r="10" fill="#90A4AE" />
    <text x="46" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#212121">×2</text>

    <!-- Resistance -->
    <circle cx="210" cy="40" r="10" fill="#78909C" />
<text x="226" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#212121">-20</text>

    <!-- Retreat -->
    <g transform="translate(400, 30)">
      <circle cx="0" cy="10" r="10" fill="#BDBDBD" />
    </g>

    <text x="255" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#9E9E9E" text-anchor="middle">© Homemade Pokémon Archive • Vector Edition 2026</text>
  </g>
</svg>