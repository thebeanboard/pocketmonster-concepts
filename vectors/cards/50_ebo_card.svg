<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="600" height="850">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE4EC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FCE4EC" />
    </linearGradient>
    <linearGradient id="foilBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#880E4F" />
      <stop offset="30%" stop-color="#EC407A" />
      <stop offset="70%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#EC407A" />
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC407A" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" flood-color="#000000" />
    </filter>
    <filter id="artShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="15" y="15" width="570" height="820" rx="28" fill="url(#foilBorder)" filter="url(#cardShadow)" />
  <rect x="25" y="25" width="550" height="800" rx="22" fill="url(#cardBg)" />
  <rect x="32" y="32" width="536" height="786" rx="18" fill="none" stroke="#EC407A" stroke-width="2" opacity="0.4" />

  <!-- Top Header Bar -->
  <g transform="translate(45, 45)">
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#880E4F" letter-spacing="1">BASIC POKÉMON</text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#212121">Ebo</text>
    
    <!-- HP -->
    <text x="440" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#880E4F">HP</text>
    <text x="465" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#212121">110</text>
  </g>

  <!-- Type Badges -->
  <g transform="translate(45, 105)">
    <rect x="0" y="0" width="95" height="24" rx="12" fill="#EC407A" />
    <text x="47.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">FAIRY</text>
    
    
    
    <text x="510" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#757575" text-anchor="end">NO. 50 / 52</text>
  </g>

  <!-- Illustration Frame -->
  <g transform="translate(45, 140)">
    <rect x="0" y="0" width="510" height="340" rx="16" fill="#FFFFFF" stroke="#880E4F" stroke-width="3" filter="url(#artShadow)" />
    <rect x="6" y="6" width="498" height="328" rx="12" fill="#FCE4EC" opacity="0.3" />
    <circle cx="255" cy="170" r="130" fill="#FCE4EC" opacity="0.5" />
    
    <!-- Embedded Traced Creature SVG -->
    <svg x="20" y="15" width="470" height="310" viewBox="0 0 230.000000 230.000000" preserveAspectRatio="xMidYMid meet">
      <g transform="translate(0.000000,230.000000) scale(0.100000,-0.100000)"
fill="#000000" stroke="none">
